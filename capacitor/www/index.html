<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Monsipan Intern</title>
		<style>
			:root {
				color-scheme: dark;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 2rem 1.5rem;
				background: #1b2027;
				color: #eceef0;
				font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
				text-align: center;
			}
			.mark {
				width: 3.5rem;
				height: 3.5rem;
				margin: 0 auto 1.25rem;
				border-radius: 1rem;
				background: #f8f000;
			}
			h1 {
				font-size: 1.375rem;
				margin: 0 0 0.5rem;
			}
			p {
				margin: 0;
				color: #a8b0b8;
				line-height: 1.5;
				max-width: 22rem;
			}
			button {
				margin-top: 1.75rem;
				padding: 0.75rem 1.5rem;
				border: 0;
				border-radius: 0.75rem;
				background: #f8f000;
				color: #1b2027;
				font-size: 1rem;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="mark"></div>
			<h1>Keine Verbindung</h1>
			<p>Das Lager ist gerade nicht erreichbar. Bitte WLAN oder Mobilfunk prüfen und erneut versuchen.</p>
			<button type="button" onclick="location.reload()">Erneut versuchen</button>
		</main>
	</body>
</html>
